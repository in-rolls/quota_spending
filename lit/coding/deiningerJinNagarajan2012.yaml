    outcome_family: other
    diff: -0.0419
    se: 0.00735
    se_source: from_t
    p_or_stars: "***"
    control_mean: 0.567
    control_sd: null
    n_units: 233
    n_obs: 23479
    adjusted: true
    table: "Table 6, Model 1, col. 2"
    page: "25"
    preferred: true
    note: >-
      Composite of drinking water, schools, health and sanitation; cannot be split. t = -5.702 printed; se = |diff/t|.
      Coefficient is for men (the model interacts reservation with a female dummy); reserved now x female = -0.00196
      (t -0.334), so the women's effect is about -0.044. control_mean is the male never-reserved mean from Table 4
      (p. 23), not currently-unreserved. Lag-1 coefficient 0.00355 (n.s.).
