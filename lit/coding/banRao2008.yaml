normative:
  - version: wp2007
    claim: "Results favour the optimists about reservation; women gain with experience, and reserved presidents need a more supportive environment in upper-caste-dominated villages and less mature states."
    stance: pro_quota
    quote: "Thus, our results are far more supportive of the \"optimists\" than the \"pessimists.\" In particular, women presidents become more effective when they acquire more political experience. The results also suggest that women reserved presidents would benefit from a more supportive environment in upper caste dominated villages, and in states where the reservations system is less mature."
    page: "17"
    note: "Also p. 14: experience result 'provides an empirical basis for encouraging women to take leadership positions'. Support is not made conditional on the supportive environment, so coded pro_quota rather than conditional."
  - version: edcc2008
    claim: "Results favour the optimists about reservation; women presidents may benefit from facilitation and training where institutions are less supportive."
    stance: pro_quota
    quote: "As women acquire more experience via the reservations system and as the system continues to mature, women will become more effective leaders. Thus, our results are far more supportive of the \"optimists\" than the \"pessimists\" but suggest that women presidents may benefit from facilitation and training in less supportive institutional environments."
    page: "527"
    note: "The caste/state-specific policy sentence of the WP becomes a generic call for 'facilitation and training'. Borderline conditional; coded pro_quota because training is an add-on, not a condition for support."

measurement:
  preferences:
    method: pra_focus_group
    unit_of_gap: village
    gap_assumption: constant
    tested_gap: "yes"
    quote: "The PRA techniques were also employed on a group of selected women to get measures of women's preferences on problems faced by the village."
    page: "507 (edcc2008)"
    note: "Women's group PRA vs the general PRA, which was 'mainly men' (p. 507). Outcome: whether the group names an item as a problem '2 years ago'; gap = LPM on a female indicator with village FE, SEs clustered by village (Table 5, p. 514), i.e. one pooled within-village gap. A second source is the household questionnaire, where one adult per household rank-orders village problems (hh_survey_rank, individual level, n = 2,113 literate adults 21+; Table 6, p. 514); with village FE no gaps remain. The authors note the two sources disagree."
  outcomes:
    source: own_audit_or_pra
    units: "Village-level standardized counts of panchayat activities since the last election by sector (from PRA); binary facility-improvement indicators from an investigator's facility survey; GP-level indicator that the president met higher panchayat officials"
    n_units: 106
    assignment_unit: gp
    quote: "In the PRA, respondents were asked to assess the number of activities of the panchayats after the last election on a variety of public-good investments. In order to have comparable measures across the public-goods categories, we standardize the actual counts by subtracting from each count its mean and then dividing by its standard deviation."
    page: "511 (edcc2008)"
    note: "310 villages in 106 GPs. Facility outcomes: 'In the survey we asked whether there were any improvements in different categories of public goods since the last GP election' (p. 511). The PRA is mostly men, which the authors flag as a possible male bias."

