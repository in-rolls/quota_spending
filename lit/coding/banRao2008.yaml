key: banRao2008
versions:
  - id: wp2007
    file: ban_rao_2007_wp.pdf
    citation: "Ban & Rao, 'Tokenism or Agency? The Impact of Women's Reservations on Village Democracies in South India', World Bank working paper, May 2007"
    year: 2007
    page_offset: "printed = pdf (pdf p. 1 = printed 1). Text layer renders the fi/ff/fl ligatures as '…', '¤', '‡'; quotes below restore the letters."
  - id: edcc2008
    file: ban_rao_2008_edcc.pdf
    citation: "Economic Development and Cultural Change 56(3): 501-530, 2008"
    year: 2008
    page_offset: "printed = pdf + 500 (image scan; quotes taken from OCR text in scratchpad/ocr/ban_rao_2008_edcc/p-NN.txt, with obvious OCR misreads such as 'mote' for 'more' corrected)"
meta:
  year_first: 2007
  year_published: 2008
  setting: "Andhra Pradesh, Karnataka, Kerala, Tamil Nadu: 9 districts, analysis sample of 106 GPs (27 women-reserved, 79 unreserved), 310 villages; survey Nov-Dec 2002"
  design: "rotational reservation (ordered by female population share, treated as exogenous), cross-section; block FE, block-pair FE for state interactions; balance probits on 1991 census"

mechanism:
  # ---------------- 2007 working paper ----------------
  - version: wp2007
    claim: "Women presidents are not weak tokens: they come from the top of the distribution of eligible women in land, wealth and knowledge, so they perform no worse than men."
    type: selection_who_runs
    status: tested
    direction: explains_null
    quote: "Women presidents are not weak. They are from the upper end of the distribution of women and tend to be more knowledgeable about political activities, more politically experienced, and wealthier than the average woman."
    page: "16-17"
    note: "Tested: Table 8 summary statistics and Table 9 regressions comparing women presidents with eligible women (block FE). Same in EDCC."
  - version: wp2007
    claim: "Women are not proxies for husbands: fewer than 20 percent were persuaded to run by their spouse."
    type: proxy_husband
    status: tested
    direction: explains_null
    quote: "Second, tokenism does not appear to be working through the spouse's influence. Less than 20 percent of women presidents are persuaded to run by their spouse."
    page: "4"
    note: "Proxy channel tested and rejected. Evidence is a cross-tab (Table 7, p. 28: spouse 5 of 27 = 18.52% vs 1.27% unreserved). Measures only who persuaded the candidate to run, not influence in office (a point Gajwani & Zhang 2008 p. 19 make against it)."
  - version: wp2007
    claim: "Inexperienced women presidents underperform men, but women gain more from political experience and catch up."
    type: experience_learning
    status: tested
    direction: explains_negative
    quote: "The most important result is that political experience matters in panchayats reserved for women. In fact, women presidents without previous political experience perform worse relative to their male counterparts."
    page: "14"
    note: "Table 10 (p. 31): reservation x experience .268** (.111), reservation main effect -.358* (.181). Table 11 meeting higher officials: reservation x experience .533***."
  - version: wp2007
    claim: "Where upper castes own more of the land, patriarchy is stronger and women presidents are less effective."
    type: patriarchy_backlash
    status: tested
    direction: explains_negative
    quote: "these results should not be interpreted as high castes blocking the efforts of low castes, but of patriarchy being more pronounced in villages dominated by upper castes which stifles women's ability to lead."
    page: "15"
    note: "Interaction tested (Table 12: reservation x upper-caste land proportion -.367**); the patriarchy reading is the authors' interpretation, not measured. Not replicated for meeting higher officials (Table 13)."
  - version: wp2007
    claim: "Women do worst in Andhra Pradesh, where the reservation system is least mature; maturity of the panchayat system helps women more than men."
    type: discretion_institutions
    status: asserted
    direction: explains_negative
    quote: "We also see that women presidents in reserved GPs in AP perform the worst, while those in Kerala and Karnataka tend to perform better. This again indicates the salience of the maturity of the reservations system since it has been in place much longer in Kerala and Karnataka than in AP."
    page: "17"
    note: "State interaction tested (Table 14: reservation x AP -1.074***), but 'maturity' is not measured; only 3 women presidents in AP. The maturity sentence is DROPPED in EDCC, which says only 'some evidence' (p. 527). Abstract: 'institutional factors matter much more for women than for men' (p. 1)."
  - version: wp2007
    claim: "Panchayats outside Kerala have little discretionary money, which may limit what any president, male or female, can change."
    type: discretion_institutions
    status: speculated
    direction: explains_null
    quote: "This lack of budgetary discretion could impede the ability of GPs, both reserved and unreserved, to have much of an impact."
    page: "10"
    note: "Motivates using meetings with higher officials as a resource-free activity measure."
  - version: wp2007
    claim: "Women presidents meet higher officials less, either because of weaker networks and communication skills or because officials are reluctant to meet them."
    type: contact_networks
    status: speculated
    direction: explains_negative
    quote: "We are unable to distinguish between whether this stems from poorer networks and communication skills among women presidents, or from an increased reluctance among higher officials to meet with women presidents."
    page: "10"
    note: "The meeting gap itself is estimated (Table 4: -.202**); its cause is not. Treated as an outcome, not as the reason for other results."
  - version: wp2007
    claim: "Unlike Chattopadhyay and Duflo, women leaders do not follow women's preferences, perhaps because South India has much smaller gender differentials than Rajasthan and West Bengal."
    type: other
    status: speculated
    direction: explains_null
    quote: "The contrast with Chattopadhyay and Duflo may reflect the fact that their evidence is from Rajasthan and West Bengal, an area of India with much higher gender differentials than South India where our survey was conducted."
    page: "16"
    note: "Context (regional gender inequality) offered for the null on preference-congruent provision; not tested."
  - version: wp2007
    claim: "Reservation does not raise women's gram sabha participation because it is already high in these states (ceiling)."
    type: other
    status: speculated
    direction: explains_null
    quote: "One reason for this divergence from CD is that in our sample women's participation in the Gram Sabha is already at a much higher level relative to West Bengal (33 percent vs 7 percent) so there is less room for growth."
    page: "9"
    note: ""

