    source: see multiple_testing
    note: |-
      Split out of multiple_testing; the audit found no joint significance test in the paper.
  multiple_testing:
    value: ''
    status: mismatch
    proposed: none (15 participation indicators and 27 or 12 service indicators, each tested separately. The 15 are combined into a political participation index, but only as a regressor in Table 6, not as the outcome for the female-sarpanch effect)
    source: pp. 511-515; Tables 4 and 6 (pp. 512, 515)
    note: |-
      The headline result is a count of separately tested indicators: "for 6 of the 15 indicators having a female sarpanch tends to improve political participation and empowerment" (baseline, p. 511). The introduction and conclusion say "7 of the 15". None of the 15 effects is adjusted for multiplicity. With 15 tests at the 10% level, about 1.5 false positives are expected by chance, and 4 of the 6 baseline hits are only significant at 10% (Table 4). The paper builds two "political participation indices (PPIs)", a normalized sum and a PCA index, "to avoid multi-collinearity issues" (p. 513). Those indices enter Table 6 only as controls. They are never regressed on the female-sarpanch dummy. The service regressions (12 outcomes) are likewise uncorrected.
  results:
    value: |-
      “For the majority of indicators we do not find any statistically significant effect that having a female sarpanch leads to better or worse service delivery.” (pg. 513)

      “...no differences in any of the indicators, except for the number of bus stops” (pg. 513; see Table 5)
    status: mismatch
    source: p. 513; Table 5 (p. 514); Table 4 (p. 512); p. 515
    note: |-
      Both quotes are verbatim from p. 513, but the cell has two problems. (1) It leaves out the paper's main finding, although the outcomes cell lists participation first. Abstract and p. 515: "having a female sarpanch has a positive effect on 7 of the 15 indicators of political participation and empowerment, with the remaining indicators showing no significant difference between villages with a male or a female sarpanch". The effect is driven entirely by SC/ST and poorer women (p. 513). (2) "number of bus stops" is the paper's wording, but Table 5 has no count of bus stops. The one significant row is satisfaction with the bus stop: female 0.63 vs male 0.85, p = 0 (Table 5, p. 514), so women in female-sarpanch villages are LESS satisfied. The regressions are not uniformly null either (Table 6). Female sarpanch has odds ratios of 0.011*** for ration shop, 0.653** for satisfaction with welfare programmes, 0.521** and 0.545** for perceived improvement in roads and ration shops, and 1.827** for employment programmes. The paper itself calls these "very mixed effects" (p. 513).
    proposed: |-
      “we find that having a female sarpanch has a positive effect on 7 of the 15 indicators of political participation and empowerment, with the remaining indicators showing no significant difference between villages with a male or a female sarpanch.” (pg. 515; Table 4) The effect is concentrated among SC/ST and poorer women (pg. 513).

      “For the majority of indicators we do not find any statistically significant effect that having a female sarpanch leads to better or worse service delivery.” (pg. 513; Table 6 shows “very mixed effects”)

      Only difference in means: lower satisfaction with bus stops in female-sarpanch villages (0.63 vs 0.85; Table 5)
