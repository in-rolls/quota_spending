    status: confirmed
    source: p. 505
    note: |-
      "Our data come from two surveys collected between October and November 2008 in Sangli district" (p. 505). The survey is a single cross-section.
  kind_of_data_for_outcomes:
    value: Survey of sarpanches + HH survey of women in the same GPs
    status: confirmed
    source: p. 505
    note: |-
      Matches p. 505. Every outcome comes from the women's household survey. Even the "objective" service indicators in Table 5 are respondent-level (N = 640). The sarpanch survey supplies controls and descriptives (Table 2).
  number_of_outcomes:
    value: '27'
    status: mismatch
    source: Tables 3A/4 (pp. 508, 512); Table 5 (p. 514); Table 6 (p. 515)
    note: |-
      27 is the number of service rows in Table 5 only: 5 objective indicators + 11 satisfaction ratings + 11 improvement-perception items = 27. It leaves out the paper's primary outcomes, the 15 political participation and empowerment indicators (Tables 3A and 4; "the 15 different outcome variables", p. 511). The outcomes cell does list those. Total = 15 + 27 = 42. For reproducibility, the regressions in Table 6 cover only 12 of the 27 service indicators.
    proposed: 42 (15 political participation/empowerment indicators, Tables 3A–4; 27 service-delivery indicators, Table 5, of which 12 are in regressions, Table 6)
  outcomes:
    value: |-
      Political participation / empowerment: formal participation, informal participation, political information, confidence/voice, and ratings of village institutions.

      Public service delivery: objective infrastructure/service availability, satisfaction with services, and perceived service improvement over time.
    status: confirmed
    source: Table 3A (p. 508); Table 4 (p. 512); Table 5 (p. 514)
    note: |-
      The five participation groups match the Table 3A/4 panel headings: "Formal political participation", "Informal political participation", "Information on political issues", "Self-rated confidence on political involvement", "Rating of village institutions". The three service groups match the Table 5 panels: "Objective indicators", "Respondent's satisfaction with", "Respondent's perception of improvement over last 3 years".
