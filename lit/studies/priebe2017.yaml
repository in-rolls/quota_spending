key: priebe2017
label: Priebe (2017)
pdf: priebe_2017_ods.pdf
pdf_version: Oxford Development Studies 2017
notes: null
audit_notes: |-
  Label and version are correct. The PDF is the published article: Oxford Development Studies 45(4): 499-521, 2017, DOI 10.1080/13600818.2017.1298740 (pdf p. 1). Printed page = pdf page + 497.

  Double counting, which a referee will catch. This paper and satheEtAl2013 use the SAME survey: 32 villages in Sangli district, 640 women, 16 female and 16 male sarpanches, Oct-Nov 2008. Footnote 5 (p. 517) says: "Please see Sathe, Klasen, Priebe, and Biniwale (2013) for more details on the data-set." If both appear in Table 2 without a note, they look like two independent confirmations when they are one sample.

  The two papers also describe the sampling differently. Priebe (p. 505) says 16 male sarpanches "were randomly selected" from the 498 male-headed GPs. Sathe et al. (pp. 4-5) say each male-sarpanch village was chosen to match a female one on "geographical closeness" and an open-category sarpanch. That second description is matched sampling, not random sampling. p. 505 also contains a typo, "166 female sarpanches were randomly selected", which should be 16.

  Treatment is having a female sarpanch, not reservation strictly. Footnote 6 (p. 517): 15 of the 16 female-sarpanch GPs were reserved, and one woman won an unreserved seat.

  The paper's main outcome is women's political participation (15 indicators). Public service delivery is presented as an "Extension" (Section 4.3).
summary:
  sample:
    value: 32 GPs from 1 District
    status: confirmed
    source: p. 505
    note: |-
      p. 505: "an individual survey covering 32 sarpanches" (16 male, 16 female) from the 705 GPs of Sangli district, plus "a household survey of 640 women ... In each of the 32 GPs, 20 women were randomly chosen." Correct as stated. The unit of analysis for every outcome is the 640 women (N = 640 in Tables 4 and 6), which the cell could add.
