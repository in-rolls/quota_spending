label: Raabe et al. (2009)
pdf: raabe_sekher_birner_2009_ifpri_dp878.pdf
pdf_version: IFPRI DP 00878 July 2009
notes: null
audit_notes: |-
  PDF and pagination. Downloaded from the CGSpace record behind the bib URL (https://hdl.handle.net/10568/161987; bitstream c85053d0-fd33-400a-b7bb-05a04874175f). The cover reads "IFPRI Discussion Paper 00878 / July 2009 / The Effects of Political Reservations for Women on Local Governance and Rural Service Provision / Survey Evidence from Karnataka / Katharina Raabe, Madhushree Sekher, Regina Birner" (pdf p. 1). All page cites here are the paper's printed pages; printed page = pdf page - 7. The `notes: MISSING PDF` line is now stale.

  Label and bib. "Raabe et al. (2009)" is right: three authors, Raabe first, cover dated July 2009. The bib entry (raabeSekherBirner2009) matches the cover on authors, title, series and number (00878). The only oddity is that the copyright line reads "Copyright 2008 International Food Policy Research Institute" (pdf p. 2); 2009 is the right year to cite. A `month = jul` could be added; nothing needs correcting.

  Design. This is a cross-section with no experiment. It compares 23 GPs with a woman president in a seat reserved for women against 48 GPs with a male president, whether he won an open seat or one reserved by caste (Tables 4, 9, 10). The 6 women who won open seats are dropped from the comparison (Table 1). Identification rests on the rotation of reserved seats. The balance check (Table 2, 17 logits with district fixed effects, N = 63) finds the SC population share significant at 5% and three facility shares at 10%: 4 of 17 tests, where about 1.7 would be expected by chance at 10%. Every regression is run twice, once with a dummy for female-headed GPs and once with a dummy for male-headed GPs (p. 51). The two columns mirror each other and are not independent evidence. Many of the descriptive gender tests are only "available on request" (fns. 15, 26, 29, 35, 41, 47). The authors call their own models weak: "the results are tentative at best, because the empirical specifications do not perform particularly well" (p. 60), and "Due to poor model performance, the results are at most tentative" (p. 64).

  Timing. The current GP term began in February 2005, and the authors say that "spending decisions in earlier years are unlikely to represent the gender effects of reservation policies" (p. 69). So the 2003/04 and 2004/05 spending in Table 13, which the first Results quote draws on, mostly reflects the previous councils.

  Internal inconsistencies a referee may notice. The strata counts on p. 10 (3 + 18 + 14 + 11 + 14) add to 60, not the stated 80 GPs. Table 1 accounts for 77 GPs (53 reserved + 24 unreserved). The paper describes its ordered models as "generalized ordered logit" (p. 51), but Tables 24-26 are titled "heteroskedastic ordered logistic regression". The continuation of Table 25 is headed "quantity of drinking water" although Table 25 is about quality (p. 58).

  Contrary evidence that the table's cells leave out. In GP members' reports, female-headed GPs are more likely to report insufficient drinking water (6.372**, Table 27) and poor drainage maintenance (9.024***, Table 28), and the authors read the first as supporting "a gender effect" (p. 61). In household drainage satisfaction, the female-headed dummy is -0.902** in one of four specifications (Table 26). In Gram Sabha attendance, the female-headed dummy is positive and significant (1.295**, 1.110**, 1.270**) once interaction terms are added (Table 31). Against these, the paper's headline is weak or null effects of reservation: "the empirical evidence from (non-)linear probability models lends weak support to the existence of gender effects of reservation policies on local governance and rural service provision" (abstract, p. vii).
