    source: pp. 51-52
    note: |-
      Row is empty in the source table. From p. 51: "We conducted a survey in 32 villages of Sangli district in western Maharashtra in October-November 2008". Sixteen female-sarpanch villages were drawn with probability proportional to size across 10 talukas, then at random from the zilla parishad list. "Then we selected one male sarpanch village for every female sarpanch village" by geographic closeness (p. 51). Within each village, 10 BPL and 10 APL households were sampled at random, giving "640 women respondents (32 villages × 20 women)" (p. 52). 22 villages had 2005 elections and 10 had 2007 elections (p. 51). Same sample as the discussion paper.
    proposed: 32 GPs (16 female-sarpanch, 16 matched male-sarpanch) from 1 district; 640 women (20 per village, 10 BPL + 10 APL)
