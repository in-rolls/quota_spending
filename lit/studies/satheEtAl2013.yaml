      none
    source: see multiple_testing
    note: |-
      Split out of multiple_testing; the audit found no joint significance test in the paper.
  multiple_testing:
    value: ''
    status: mismatch
    source: p. 52; Tables 4-6 (pp. 54-55)
    note: |-
      The only protection against multiplicity is aggregation. Items are coded 0-1, summed with "equal weight", and expressed as a percentage of the maximum score (p. 52; the discussion paper says "equal weights"), which produces IOSA from 20 items and IODP from 18 items. Individual items are never tested one by one. The two indices are then tested repeatedly: 6 Z-test rows each in Tables 4-5 (overall, by election year, by gender within year; p. 54), and 5 OLS columns in Table 6 (p. 55). There is no correction for these many comparisons, and Table 6 stars use one-tailed thresholds ("* refers to 90%, ** 95% and ***99% significance (one-tailed test)", p. 55).
    proposed: summary index (IOSA and IODP are equal-weighted indices of 20 and 18 items. There is no correction across the 12 Z-test comparisons and 5 regressions, and Table 6 uses one-tailed tests)
  results:
    value: ''
    status: mismatch
    source: p. 56; pp. 54-55; Tables 4-6 (pp. 54-55)
    note: |-
      Row is empty in the source table. IOSA overall: female 46.70 vs male 46.78, not significant (Table 4 row 1). For 2005 elections: 49.46 vs 46.73, significant. For 2007 elections: 40.64 vs 46.89, significant in the opposite direction. IODP overall: 39.81 vs 36.78, significant (Table 5). In Table 6 the Gen coefficient on IOSA is -0.478 (not significant). With the interaction, Gen is -4.525*** and Gen*Elect05 is +5.903***. Gen on IODP is 2.601***. All numbers identical in the published version. Do not use the conclusion's claim that participation is higher "for elections held both one year back and three-and-a-half years back" (pp. 56-57), because Table 5 row 3 contradicts it (see audit_notes).

      2026-10-24, switched to published version (EPW 2013): the two quotes in `proposed` now use the EPW wording and pages. Quote 1 was DP p. 12 ("..., if the election has been held 3 to three and a half years before the survey."), now p. 56 (no comma; "three to three-and-a-half years"). Quote 2 was DP p. 9 ("the female democratic participation ..."), now pp. 54-55 (EPW drops the leading "the").
    proposed: |-
      “we find that gender of the sarpanch is not a significant causal factor in explaining the availability of public services on average. But we find that the availability of basic services is significantly higher in female sarpanch villages as compared to the male sarpanch villages if the election has been held three to three-and-a-half years before the survey.” (pg. 56; Tables 4 and 6)

      Where the female sarpanch was elected in 2007 (about one year before the survey), service availability is significantly lower than in male-sarpanch villages (40.64 vs 46.89; Table 4).

      “female democratic participation is significantly higher in the female sarpanch villages as compared to the male sarpanch villages” (pgs. 54-55; Table 5)
