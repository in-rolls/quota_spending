    source: p. 52; Appendices A-B (p. 57); Tables 4-6 (pp. 54-55)
    note: |-
      Row is empty in the source table. How counted: the paper tests two outcome indices, IOSA (Index of Services Availability) and IODP (Index of Democratic Participation). Each index is a respondent's share of the maximum possible score, and each is compared in Tables 4-5 and regressed in Table 6. IOSA is built from 20 questions (Appendix A) covering 8 service areas (p. 52). IODP is built from 18 questions (Appendix B, which is mislabelled "Questions Asked for IOSA" in the published version too). If the author prefers to count items, the answer is 38. Same counts as the discussion paper.
    proposed: 2 (indices built from 20 + 18 survey items)
  outcomes:
    value: ''
    status: mismatch
    source: p. 52; Appendices A-B (p. 57)
    note: |-
      Row is empty in the source table. IOSA covers "(1) drinking water, (2) toilets, (3) gutters, (4) schools, (5) ration shops, (6) self-help groups, (7) implementation of welfare schemes with special reference to Nirmal Gram Yojana (i e, cleanliness schemes), Janani Suraksha (i e, maternal health scheme), (8) male alcoholism" (p. 52; EPW wording, the discussion paper numbers them "1. ... 8. Male Alcoholism"). Roads, electricity and health services are deliberately excluded (p. 52; note 2, p. 57). IODP covers voting, gram sabha attendance, knowledge of GP working, meetings with the gram sevak, confidence raising complaints, political and social activity, awareness of rights, and unity among women (p. 52; Appendix B, p. 57).
    proposed: |-
      Index of Services Availability (drinking water, toilets, gutters, schools, ration shops, SHGs, welfare schemes (Nirmal Gram Yojana, Janani Suraksha), male alcoholism)

      Index of Democratic Participation (voting, gram sabha attendance and voice, knowledge of GP, contact with gram sevak, political activity, rights awareness, unity among women)
  joint_tests:
    value: ''
    status: mismatch
