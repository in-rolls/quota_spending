label: Sathe et al. (2013)
pdf: sathe_klasen_priebe_biniwale_2013_epw.pdf
pdf_version: Economic and Political Weekly 48(11) 2013, pp. 50-57 (JSTOR copy; printed page = pdf page + 48)
notes: row is empty in the source table
audit_notes: |-
  Label and version. Page cites now refer to the published article: Economic and Political Weekly 48(11), March 16, 2013, pp. 50-57, "Can the Female Sarpanch Deliver? Evidence from Maharashtra" (JSTOR copy; pdf p. 1 is the JSTOR cover, so printed page = pdf page + 48, checked against the running heads on pdf pp. 2-8). The audit was first done on the Courant Research Centre (CRC-PEG, Göttingen) Discussion Paper No. 138 (April 2013), whose p. 2 says "A version of this article has appeared in Economic and Political Weekly Vol 48(11): 50-57 (2013)". The EPW text is a lightly copy-edited version of the discussion paper: same sample, same Tables 1-6 with the same numbers, same appendices (moved to p. 57). Wording differs in places (e.g., "3 to three and a half years" became "three to three-and-a-half years"), so quotes below use the EPW wording. In EPW, Tables 1-6 sit in the text (pp. 52-55), not in an appendix.

  Same data as priebe2017. Both papers use the Oct-Nov 2008 Sangli survey: 32 villages, 640 women, 32 sarpanches. Listing both in Table 2 double-counts one sample unless a note says so.

  Treatment is female sarpanch versus male sarpanch. The paper does not say how many of the female-sarpanch seats were reserved (Priebe fn. 6 says 15 of 16). Male-sarpanch villages were chosen by "geographical closeness" to each female-sarpanch village and an open-category sarpanch (p. 51). That makes this a matched comparison, not a random one.

  Weaknesses a referee would note. The comparisons are univariate Z-tests plus an OLS with one-tailed significance (Table 6 note, p. 55: "one-tailed test"). Standard errors are not clustered, although treatment varies at the village level (32 clusters). The 2005-versus-2007 election split confounds female-sarpanch tenure with village-level election timing, and the 2007 split has 5 villages per cell.

  The conclusion contradicts the paper's own Table 5. pp. 56-57 say participation of women is higher in female-sarpanch villages "for elections held both one year back and three-and-a-half years back". Table 5 row 3 (2007 elections, p. 54) shows the reverse: female 26.99 vs male 30.72, "Significant". The text on p. 55 agrees with the table ("if the year of election is 2007, then it is the male sarpanch villages that have a significantly higher iodp"). The published version did not fix this.

  Tables 1-3 (pp. 52-53) report "Sample size 30 30", which is inconsistent with 16 + 16 villages (and with 320 + 320 respondents in Table 3). Table 5 row 1 (p. 54) gives N = 220 for the female group, where the text implies 320. Both errors are also in the published version. The text on p. 54 gives the 2005 female IOSA mean as 49.6; Table 4 row 2 gives 49.46.
