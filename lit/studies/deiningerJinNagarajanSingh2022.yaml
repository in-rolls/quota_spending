  results:
    value: |-
      “We find that contemporaneous reservation of leadership for women affected local governance as measured by the quality of NREGS implementation but had no measurable impact on female labour supply. At the same time, female leadership reservation affected female labour supply to public workfare and private sector labour markets in the following period… Past reservation also increased women’s income, their demand for work, and – presumably due to increased access to resources – their participation in household decisions relating to spending on food items, health, and education.” (pg. 1774)

      “Past reservation is estimated to have led to an 8.9 percentage point increase in the likelihood of female labour force participation” (pg. 1782)

      Lagged reservation increased women’s individual income by some 76 log points, women’s demand for work by some 16 percentage points, and women’s participation in household decisions by 18 percentage points for food, 14 for health, and 8 for education. (see pg. 1784; Table 5)
    status: corrected
    source: pp. 1774, 1782, 1784; Tables 2 (p. 1781), 5 (p. 1786)
    note: |-
      None of the three WPS passages is verbatim in JDS, so the value (WPS wording, WPS pages 3, 12, 15) is left as the author coded it and the published wording is proposed. (1) WPS p. 3 "Three findings stand out: First, ..." is rewritten on JDS p. 1774 without the numbering; the ellipsis in the proposal drops "Effects were quantitatively large (half a standard deviation) and most pronounced for married women." (2) WPS "8.2 percentage point ... labor force participation" is "8.9 percentage point ... labour force participation equivalent to a 11.8% increase at the mean" on p. 1782; Table 2B: -0.029 + 0.118 = 0.089. (3) p. 1784 says income rose "by some 76 percentage points (8.4%)" (it is a log outcome, so log points), demand for work "by some 16 percentage points", and decisions on "food, health, and education ... by 18, 14, and 8 percentage points". Table 5 (checked on the rendered page): income -0.221 + 0.983 = 0.762; wants to work more 0.005 + 0.163 = 0.168; food -0.029 + 0.204 = 0.175; health 0.085 + 0.057 = 0.142; education 0.044 + 0.040 = 0.084 (F-test p = 0.014). The text again omits nonfood: 0.143 - 0.009 = 0.134, p = 0.016.
    comment: |-
      2026-10-24, split Deininger row (author approved): status confirmed -> mismatch; WPS quotes (pp. 3, 12, 15) not verbatim in JDS, published wording with pp. 1774, 1782, 1784 in proposed; value unchanged
      2026-10-24, author approved: adopted published-version value.
    previous: |-
      “Three findings stand out: First, contemporaneous reservation affected local governance as measured by the quality of NREGS implementation but had no measurable impact on female labor supply. Second, beyond the reserved period, female leadership reservation had sustained effects on female labor supply to public workfare and to private sector labor markets… Third, past reservation also increased women’s income, their demand for work, and their participation in household decisions relating to spending on food items, health, and education.” (pg. 3)

      “Past reservation is estimated to have led to an 8.2 percentage point increase in
      the likelihood of female labor force participation.” (pg. 12)

      Lagged reservation increased women’s individual income by about 78%, increased women’s desire to work by about 16 percentage points, and raised women’s participation in household decisions by about 16 percentage points for food, 14 percentage points for health, and 7 percentage points for education. (see pg. 15)
