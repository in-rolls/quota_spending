  multiple_testing:
    value: ''
    status: mismatch
    proposed: none (the published table notes drop the WPS 9350 Bonferroni statement; the F-tests are linear combinations of coefficients within one outcome)
    source: Notes to Tables 2-5 (pp. 1781, 1783, 1785, 1786)
    note: |-
      WPS 9350 table notes said "multiple hypotheses tests are adjusted using the Bonferroni method". The JDS table notes (Tables 2-5, read on the rendered pages for 2, 4, 5 and OCR for 3) contain no such sentence, and the word Bonferroni does not appear in the article. The F-test rows test linear combinations such as beta2 + beta4 = 0 within one outcome; they are not joint tests across outcomes. There is no summary index. Previous proposal (written against WPS 9350): "corrected p-values (Bonferroni, per table notes; the family of tests and what exactly is adjusted are not stated)".
    comment: "2026-10-24, split Deininger row (author approved): proposed changed from WPS Bonferroni reading to 'none' because the JDS table notes have no adjustment; value unchanged ('')"
