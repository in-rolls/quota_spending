pdf_version: Journal of Development Studies 58(9) 2022, pp. 1772-1790 (scan; printed page = pdf page + 1771)
notes: null
audit_notes: |-
  This row was split out of the old mixed "Deininger et al. (2020)" row (author approved, 2026-10-24). The old row's bib entry, sample and location were the JCE 2020 paper (now deiningerNagarajanSingh2020), but its pdf, outcomes, number_of_outcomes and results came from World Bank WPS 9350 (Aug 2020), "Political Reservation and Female Labor Force Participation in Rural India". WPS 9350 was published as this article: Deininger, Jin, Nagarajan and Singh, "Addressing Declining Female Labor Force Participation in India: Does Political Empowerment Make a Difference?", J. Development Studies 58(9): 1772-1790, 2022, doi 10.1080/00220388.2022.2043278 (pdf p. 1). The JDS PDF is an image scan; text was read from OCR and every number used below was checked on the rendered page.

  The author's WPS-derived cells are carried over unchanged in value. Table numbers differ: WPS Tables 5, 6, 7, 8 are JDS Tables 2, 3, 4, 5, and the WPS appendix tables (A4-A6, sector regressions) are only in the JDS online supplement, which I did not open.

  The published numbers are not the WPS numbers. JDS has female LFP effect 8.9 pp (WPS 8.2), income "some 76 percentage points" (WPS "some 78%"), decisions on food/health/education 18/14/8 pp (WPS 16/14/7). The quotes in results are therefore not verbatim in JDS; published wording is in results.proposed. JDS table notes also drop the WPS statement that multiple hypotheses are Bonferroni-adjusted (see multiple_testing).

  Referee points carried over from the WPS audit, re-checked in JDS. (a) State count is inconsistent: p. 1774 "India's 12 main states", p. 1777 "190 villages in 13 states", note 9 (p. 1787) lists 12 states revisited in 2014/15 without Gujarat, yet the Table 1 and Table 5 notes (pp. 1778, 1786) list Gujarat among the decision-module states. (b) The analysis keeps only job-card households (23,350 of 91,984, p. 1777), so effects are conditional on having a job card. JDS justifies this by citing the JCE paper: "access to job cards was not affected by a village's current or past reservation status (Deininger et al., 2020)" (p. 1777).
