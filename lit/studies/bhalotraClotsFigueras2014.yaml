pdf_version: 'American Economic Journal: Economic Policy 6(2) 2014, pp. 164-197 (JSTOR copy; printed page = pdf page + 162)'
notes:
audit_notes: |-
  PDF and version. The PDF is the published article, American Economic Journal: Economic Policy 6(2), May 2014, pp. 164-197 (doi 10.1257/pol.6.2.164), a JSTOR copy (stable URL jstor.org/stable/43189382). Pdf p. 1 is the JSTOR cover; the article starts on pdf p. 2 = printed p. 164, so printed page = pdf page + 162 (checked on the running heads of pdf pp. 2, 3, 16 and 31). The text layer is OCR and has small errors (e.g. "POUCY" in running heads). Page and table cites here are the published printed pages. Until 2026-10-24 the cites were to Essex Economics Discussion Paper No. 739 (November 2013; printed = pdf - 1), bhalotra_clots_figueras_2013_essex_dp739.pdf, which is still in lit/papers. Mapping of the cites used here: DP abstract p. 1 -> p. 164; DP p. 4 -> pp. 165-166; DP p. 6 -> p. 167; DP p. 17 -> p. 179 (n. 11); DP p. 34 -> p. 192; DP Table 2 p. 51 -> Table 2 p. 178; DP Table 8 p. 57 -> Table 8 p. 193. Table numbers are unchanged, and the Table 2 col. 6 coefficients and standard errors quoted in the note are identical in the published version. Wording differences in quoted passages are American spelling and style only ("33.5%" -> "33.5 percent"; "favour" -> "favor"). The earlier IZA DP 6216 (December 2011) was also downloaded; it is not used. The label year 2014 matches the bib. The notes field still says "MISSING PDF"; that is now stale.

  What the study is. It is about state legislators (MLAs), not village councils, and there is no reservation. The treatment is the share of a district's state-assembly seats won by women, instrumented by the share won by women in close mixed-gender races (Table 2, p. 178). The outcomes are neonatal and infant mortality from NFHS-2 birth histories (1998-99), health-seeking behaviours (Table 7, p. 190) and village facilities (Table 8, p. 193).

  What the paper does not measure. It has no data on citizens' or legislators' preferences, stated or revealed by survey, by gender. Women's stronger concern for child health is a premise, not a finding: it is argued from the costs of poor services falling on women and from literature (Miller 2008, the British Election Survey; p. 165). The authors then infer it from what women legislators do. So in the What Women Want table this row classifies a policy domain by politician behaviour. It is not evidence that female villagers or voters prefer it. That fits the section heading "Supporting studies used to classify policy domains", but the table notes' definition of F ("women express relatively stronger preference or issue salience") does not describe what this study measures. A note in the table would make the distinction clear.
preferences:
- row: null
  codes:
    child_mortality:
      value: F
      status: confirmed
      source: abstract (p. 164); pp. 165-166; p. 167; p. 179 (n. 11); p. 192; Table 2 (p. 178); Table 8 (p. 193)
      note: |-
        Supported as a domain classification based on legislators' behaviour, not on any measured preference gap.
        Main result: "a 10 percentage point increase in the share of women elected from the index district to state assembly seats results in a 2.1 percentage point (33.5 percent) reduction in neonatal mortality" (pp. 165-166). Table 2 col. 6 (2SLS with mother FE): neonatal -0.2061*** (0.078). Infant mortality is weaker: -0.1916* (0.104), significant only at 10%, and the paper says it is driven by neonatal deaths (p. 179, n. 11).
        Basis for "women want this": the paper argues that "the costs of poor services in this domain fall disproportionately upon women" (abstract, p. 164) and states "We have identified public health as a domain over which we expect women have stronger preferences." (p. 167). The only evidence on preferences is indirect, from Table 8: women legislators bring more health facilities and fewer banks. "However our finding that women favor health over financial infrastructure suggests that preferences do play a role." (p. 192). The same paragraph admits that part of this may reflect positive selection of women who win close races.
        No gender gap in preferences is tested. F is therefore supported only in the sense that women legislators act on child health. If the column must mean expressed preference or salience, the cell would be unverifiable from this paper.
