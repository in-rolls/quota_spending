key: gajwaniZhang2015
label: Gajwani & Zhang (2015)
pdf: gajwani_zhang_2015_wber.pdf
pdf_version: World Bank Economic Review 29(2) 2015, pp. 234-261 (printed page = pdf page + 233)
notes: bib cites the 2015 published version
audit_notes: |-
  Label year. The PDF is World Bank Policy Research Working Paper 6854, dated "May 2014" on the cover (pdf p. 1). So "Gajwani & Zhang (2014)" is right for this PDF, and every page cite in the Table 2 row ("pg. 6") uses the working paper's pagination. The bib's 2015 entry is presumably the published version (World Bank Economic Review; I have not verified the volume or pages because that PDF is not in lit/papers). Table 1 (2014), Table 2 and the bib (2015) must agree. If the bib stays at 2015, the page cites need to be re-checked against the journal pagination, since "pg. 6" will not match it. Otherwise, cite WPS 6854 (2014) in the bib.

  What the preference codes measure. These are stated preferences (issue salience), not reservation effects. 270 citizens (139 men, 131 women) in 27 villages were asked to "list up to five infrastructure items needed in their village" (p. 16). A chi-square test cannot reject that men's and women's response distributions are the same: all responses Pearson chi2 = 23.331, Pr = 0.614; top 11, chi2 = 5.689, Pr = 0.841 (Table S1.3, p. 43). Per-item t-tests on the share of each sex naming the item show nothing significant except veterinary services (Table S1.4, p. 44; text p. 17). In Table S1.4, Difference = Men minus Women. NS is therefore the right code for every domain except the one veterinary item. A referee may object that this sample is small: 27 villages, roughly 130 per sex, so a gap of 8-9 points (drinking water, schools) is not detectable.

  Design. Reservation in Tamil Nadu is NOT random. It rotates by rank of the female-population share within each block (pp. 8-9). The paper uses a 1991-to-2005 difference-in-differences (DID): it compares how much public goods grew between 1991 and 2005 in women-reserved GPs versus unreserved GPs. Covariates are added in Table 8 and a fuzzy regression-discontinuity check is in Appendix S3. So "female presidents provide fewer ..." really means that women-reserved GPs grew less than unreserved GPs over 1991-2005. The paper also estimates that 14 of 117 non-SC GPs had a reservation status contrary to the rule (Appendix S2, p. 46).

  Uncoded domains. The Infra. and Irrigation columns are blank for this study. Streetlights (Difference 0.024, SE 0.036) and drainage (-0.036, SE 0.058) are both NS in Table S1.4 and could be coded Infra = NS if the author wants that column filled.

  2026-10-23, switched cites to published WBER 2015 version: the summary cells (sample, location, years, kind_of_data_for_outcomes, number_of_outcomes, outcomes, results) now cite World Bank Economic Review 29(2): 234-261, lit/papers/gajwani_zhang_2015_wber.pdf (printed page = pdf page + 233, checked on pdf pp. 1, 2, 3, 28 = printed 234, 235, 236, 261). Previous PDF: gajwani_zhang_2014_wb_wps6854.pdf (WPS 6854, 2014); the paragraphs above, the preferences cells, joint_tests and multiple_testing still use WPS pagination.
