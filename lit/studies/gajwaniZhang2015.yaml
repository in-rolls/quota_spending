      note: |-
        This is the only item in the paper with a significant gender difference, and it falls in Other. Text, p. 17: "There are no statistically significant differences, with the exception of veterinary services (mentioned by only 14 citizens)." Table S1.4: veterinary services, men 0.086, women 0.015, Difference 0.071*** (SE 0.027), so men > women. Everything else that would go in Other is NS: drainage, streetlights, companies/industries, library, SHG building, and so on. Plain NS hides the paper's one gendered result. It is based on 12 men versus 2 women.

        Proposal restated as a literal value. The value is unchanged (NS); the auditor's real suggestion is a table-notes footnote that veterinary services are M (p<0.01; 14 mentions, Table S1.4). That is a change to the table notes in lit/tables.yaml, to decide separately.
        Auditor's original proposal: NS, with a footnote saying that veterinary services are M (p<0.01; 14 mentions, Table S1.4)
      proposed: NS
summary:
  sample:
    value: |-
      144 GPs from 3 districts

      Notes: 1. Sampled one district each from the three development strata that were defined based on HDI, 2. 4 Panchayat Union Councils per district
    status: confirmed
    source: p. 241; Table 1 (p. 240)
    note: |-
      p. 241: districts were split into three HDI categories, one district was drawn at random from each, then 4 PUCs per district and 12 GPs per PUC ("a total of 144 GPs from 12 PUCs from three districts": Coimbatore, Pudukottai, Vellore). Of these, 47 GPs were reserved for women and 46 had a woman president (p. 246). The preference module is a separate sample of 270 citizens in 27 villages (p. 250).
    comment: |-
      2026-10-23, switched cites to published WBER 2015 version: source "pp. 10-11; Table 1 (p. 29)" -> "p. 241; Table 1 (p. 240)" (in WBER the HDI strata, 4 PUCs per district and 12 GPs per PUC are all on p. 241); note cites p. 10-11 -> p. 241, p. 13 -> p. 246, p. 16 -> p. 250. Quote "a total of 144 GPs from 12 PUCs from three districts" is verbatim in WBER (p. 241). Value unchanged.
  location:
    value: Tamil Nadu
    status: confirmed
    source: title; p. 241
    note: Coimbatore, Pudukottai and Vellore districts, Tamil Nadu.
    comment: |-
      2026-10-23, switched cites to published WBER 2015 version: source "title; p. 10" -> "title; p. 241" (the three districts are named on p. 241). Value unchanged.
  years:
    value: 2005–2006
    status: mismatch
    source: p. 240; p. 245 and fn. 18 (p. 245)
    note: |-
      2005-2006 is when the data were collected ("surveys conducted in Tamil Nadu in 2005 and 2006", p. 240). The outcome data, however, are a two-period panel from village records covering 1991 and 2005. The DID compares "the time periods 1991 ... and 2005" (p. 245). Footnote 18: "Data on public toilets, household toilets, and buses and minibuses are from 1995 and 2004." Writing only 2005-2006 suggests a cross-section and hides the pre-period.
    proposed: 1991 and 2005 (panel of village records; 1995 and 2004 for three goods). Survey fielded 2005–2006.
    comment: |-
      2026-10-23, switched cites to published WBER 2015 version: source "p. 10; p. 11 and fn. 18 (p. 12)" -> "p. 240; p. 245 and fn. 18 (p. 245)"; note cites p. 10 -> p. 240, p. 11 -> p. 245. All three quotes (p. 240, p. 245, fn. 18) are verbatim in WBER. Value and proposal unchanged.
  kind_of_data_for_outcomes:
    value: Survey + administrative records
    status: confirmed
    source: pp. 237, 242
    note: |-
      The public-goods outcomes come from GP government records via a "secondary data schedule" (p. 242). The authors stress "village-level government records instead of recall data" (p. 237). The surveys supply president interviews (knowledge test, contact with officials) and the 270-citizen preference module.
    comment: |-
      2026-10-23, switched cites to published WBER 2015 version: source "pp. 5, 10" -> "pp. 237, 242"; note cites p. 10 -> p. 242, p. 5 -> p. 237. Both quotes are verbatim in WBER. Value unchanged.
  number_of_outcomes:
    value: '10'
    status: confirmed
    source: p. 252; Tables 7-8 (pp. 251, 253-254); Appendix A2 (p. 260)
    note: |-
      How counted: one per dependent-variable column in Table 7/Table 8. p. 252 says: "We use 10 public goods measures (covering eight areas of public goods)". Not counted: the knowledge-test score (Table 5) and the three contact-frequency measures (Table 6). Those are characteristics of presidents, not outcomes of reservation on provision.
    comment: |-
      2026-10-23, switched cites to published WBER 2015 version: source "p. 18; Tables 7-8 (pp. 36-37); Appendix A2 (p. 40)" -> "p. 252; Tables 7-8 (pp. 251, 253-254); Appendix A2 (p. 260)" (Table 8 runs over two pages in WBER); note cite p. 18 -> p. 252. Table numbers are the same in WBER (Tables 5-8, Appendix A2). Quote "We use 10 public goods measures (covering eight areas of public goods)" is verbatim on p. 252; Table 7 still has 10 rows and Table 8 10 columns, so the value 10 holds. Value unchanged.
  outcomes:
    value: Health (composite measure), Schools, Distance to nearest concrete road, Bus and minibus trips, streetlights, Public toilets, Common taps, Number of borewells, HH toilet connection, HH drinking water connection
    status: confirmed
    source: Table 7 (p. 251); Appendix A2 (p. 260)
    note: |-
      Matches the 10 rows of Table 7 exactly. "Health" is a factor-analysis composite of child immunization rates (DPT, BCG, OPV, measles, TT) (A2, p. 260).
    comment: |-
      2026-10-23, switched cites to published WBER 2015 version: source "Table 7 (p. 36); Appendix A2 (p. 40)" -> "Table 7 (p. 251); Appendix A2 (p. 260)"; note cite A2, p. 40 -> A2, p. 260. WBER Table 7 has the same 10 rows. Value unchanged.
  joint_tests:
    value: ''
    status: mismatch
    proposed: |-
      none
    source: see multiple_testing
    note: |-
      Split out of multiple_testing; the audit found no joint significance test in the paper.
  multiple_testing:
    value: ''
    status: mismatch
    proposed: none (each of the 10 public-goods measures is tested separately. The only aggregation is the Health outcome, a factor-analysis composite of 5 immunization rates)
    source: pp. 5-6, 18; Tables 7-8 (pp. 36-37); Appendix A2 (p. 40); Table S1.3 (p. 43)
    note: |-
      The 10 DID coefficients are reported with their own robust SEs and stars. There is no family-wise or FDR correction and no joint test across outcomes. The paper treats having several outcomes as a robustness strength, not as a multiplicity problem: "We also use several outcome variables to measure public goods provision by the GP, allowing us to check the robustness of our results" (pp. 5-6). The HEALTH variable is "a weighted average of all of the factors listed in the group ... calculated using a factor analysis procedure" (A2, p. 40), so it is a summary index for one domain only. The paper does have a joint test, but only on preferences, not outcomes: a chi-square test of whether men's and women's response distributions differ (Table S1.3; Pr = 0.614 and 0.841). With 10 outcomes at the 10% level, about 1 false positive is expected by chance. So the "weak evidence" results (streetlights, HH toilets, HH water, all significant only without covariates) would probably not survive a correction. Schools (-0.693***, -0.840***) would.
  results:
    value: "“The results of our analysis strongly suggest that female presidents provide their GPs with fewer schools and roads.” (pg. 237; see also Table 7 and 8) \n\n“We also find weak evidence that women provide fewer household toilet connections, household drinking water connections, and streetlights. For all other public goods, there is generally no statistically significant difference between provision by male and female presidents” (pg. 237; see also Table 7 and 8)\n\nFemale presidents have lower knowledge of the panchayat system, less contact with higher-level officials (see Tables 5 and 6)."
    status: confirmed
    source: p. 237; Tables 5-8 (pp. 248-249, 251, 253-254)
    note: |-
      Both quotes are verbatim from p. 237 (WBER pagination). The first one truncates the sentence at "roads", and the original continues ", two public goods that require more connection with higher-level officials". The numbers back it up. In the basic DID (Table 7): schools -0.693***, road distance +0.078*, streetlights -13.316**, HH toilets -48.621*, HH water -50.379**. With covariates (Table 8), only schools (-0.840***) and road distance (0.106*) stay significant, which is why the paper calls the other three "weak evidence". The knowledge gap is -3.457*** points out of 19 (Table 5, col. 1), and the contact gaps are all *** (Table 6). "Pg. 237" is WBER pagination (see audit_notes).
    previous: "“The results of our analysis strongly suggest that female presidents provide their GPs with fewer schools and roads.” (pg. 6; see also Table 7 and 8) \n\n“We also find weak evidence that women provide fewer household toilet connections, household drinking water connections, and streetlights. For all other public goods, there is generally no statistically significant difference between provision by male and female presidents” (pg. 6; see also Table 7 and 8)\n\nFemale presidents have lower knowledge of the panchayat system, less contact with higher-level officials (see Tables 5 and 6)."
    comment: |-
      2026-10-23, switched cites to published WBER 2015 version: value "(pg. 6; see also Table 7 and 8)" -> "(pg. 237; see also Table 7 and 8)" in both places; source "p. 6; Tables 5-8 (pp. 34-37)" -> "p. 237; Tables 5-8 (pp. 248-249, 251, 253-254)"; note "p. 6 (WPS pagination)" -> "p. 237 (WBER pagination)" and ""Pg. 6" is working-paper pagination" -> ""Pg. 237" is WBER pagination". Both quotes are word-for-word the same in WBER (p. 237), so no quote wording changed; table numbers are unchanged, and every coefficient in the note matches WBER Tables 5-8.
