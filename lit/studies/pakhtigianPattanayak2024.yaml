      source: pdf p. 1 (ScienceDirect capture), Highlights, Abstract, Introduction
      note: |-
        What is measured is stated preference. Players contribute to "varying
        levels of sanitation and hygiene investments" in an incentivized public
        goods game (abstract). The capture supports F only conditionally. The
        highlights say "Women make larger hygiene and sanitation investments in
        experimental games settings when making choices among only other
        women". The intro says women "made larger contributions when playing
        among only other women than did men playing among only other men".
        Against F, the abstract says "In mixed gender groups, contributions
        increase with the share of male participants", and women's game
        contributions are "negatively correlated" with their actual sanitation
        practices. The capture shows no pooled women-vs-men estimate, no
        coefficients and no significance levels, so an unconditional F cannot be
        verified. A cautious code from what is visible would be "F in
        single-gender groups only". The comparison needs the results tables,
        which the capture lacks.
