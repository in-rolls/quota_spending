audit_notes: |-
  Label and version: the PDF is dated "November 7, 2015" (title page), but the label says Das (2014). The notes field records this. Either cite the 2015 version or get the 2014 draft; page and table numbers here refer to the Nov 2015 PDF.
  Data description: the tables.yaml footnote says "REDS 2006". The paper names REDS 2006 but adds "Even though the survey began in the year 2006, most of the households were surveyed in 2008" (p. 21). The final sample is 8,038 households (23,759 adults) in 233 villages across 16 states (p. 21).
  What is measured: stated preferences. Each adult picks 3 of 14 items for Panchayat investment, and the paper models a 0/1 "mentioned in top 3" marker by logit on a Woman dummy with village FE (Table 2) and by OLS with household FE (Table 3). This is a clean match to the column definition. Only the 6 most-demanded goods are analysed.
  Blank domains: electrification and street lighting are among the 14 items (fn. 18, p. 21), but no gender estimate is reported for them, so blank is right. No reported domain was left blank.
  Referee points: (i) the school and water gaps are fragile to controls (fn. 22); (ii) top-3 mention is a salience measure that is not independent across goods, because naming one item crowds out another, so a woman naming water more often mechanically lowers her other mentions; (iii) the paper labels water, sanitation and health as "women preferred" for later analysis (p. 32) based on Table 2, which fits the codes.
