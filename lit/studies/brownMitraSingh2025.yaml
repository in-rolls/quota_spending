      none
    source: see multiple_testing
    note: |-
      Split out of multiple_testing; the audit found no joint significance test in the paper.
  multiple_testing:
    value: ''
    status: mismatch
    proposed: none (47 interaction coefficients across Tables 5.1-5.7, each tested separately; no index, joint test or adjusted p-values)
    source: Tables 5.1-5.7 (pdf p. 14-22)
    note: |-
      No joint test, summary index, or correction anywhere in the paper (searched for Bonferroni, Romano-Wolf,
      FDR, q-value, joint, Wald, index; no hits). Of the 47 GW>8m x Reserved coefficients, several headline
      ones are significant only at 10% (Table 5.2 cols 4, 6-8; Table 5.6 alcohol/tobacco 0.243*; Table 5.7
      attendance 0.607*), and the paper itself flags sensitivity: with continuous depth, "only the
      consumption coefficients remain significant at the 10% level" (fn 13, p. 18) and enrollment and
      attendance lose significance (p. 20-21). Within a 191-village cross-section, this is the first thing a
      referee would ask about.
audit_notes: |-
  Label "Brown et al. 2025" matches the PDF (working paper dated September 2025; appears as an ACEGD 2025
  conference paper; no published version found by web search). Format differs from the other labels, which
  use "(Year)"; consider "Brown et al. (2025)".
  PDF page numbering: printed page = pdf page - 1 (title page unnumbered); quote 2 is cited to the pdf page,
  the other two to printed pages.
  Referee points. (1) Only reservation is random. Groundwater depth is not, so the GW>8m x Reserved
  interaction is a heterogeneity estimate whose interpretation depends on what else differs between deep-
  and shallow-groundwater villages; the paper says its "identification strategy does not require that the
  variation in groundwater levels within districts is random" (p. 12), which is true of the Reserved main
  effect but not of the interaction as a causal moderator. (2) One cross-section of 191 villages, fewer with
  groundwater data, clustered at village level; the number of reserved villages is never reported. (3) 47
  interaction tests with no multiplicity adjustment. (4) Table 5.2 has visible errors: Panel B observation
  counts (175, 352, 309, 485) are identical to Panel A's though the units differ (village-source vs village-
  firm type); col 4 GW>8m and Reserved have the same SE (41.497); the title says "Using Average GW" while the
  notes use the 8m cutoff; and the text refers to "columns (4) and (5)" for Panchayat employment, which are
  cols 3-4. (5) This is not a study of what women want or of public-good provision: the outcomes are
  household employment, income and spending.
