      The paper’s main positive results are about heterogeneity by groundwater scarcity, not about an overall average effect of women’s reservation. In the regression setup, the coefficient on Reserved captures the effect of reservation in the GW < 8 reference group, and in the main employment and household-welfare tables those coefficients are mostly small and statistically insignificant.
