notes: null
summary:
  sample:
    value: 191 villages. The number of GPs is unspecified.
    status: confirmed
    source: p. 7 (Section 3.3), pdf p. 8
    note: |-
      "the 2015/16 round of the Rural Economic and Development Survey (REDS), which covers 191 villages across
      India" (p. 7). Analysis sample: 284,898 working-age individuals in 92,322 households (p. 7). About 15% of
      villages lack groundwater readings (p. 8), so estimation samples are smaller. GPs are not counted. The
      number of reserved villages, which sets power, is not reported.
  location:
    value: 13 states
    status: confirmed
    source: p. 7 fn 7 (pdf p. 8)
    note: |-
      "Thirteen states are covered in this survey" (fn 7). States are not named. Section 4 (groundwater vs
      income) uses all-India CMIE CPHS data, but that part involves no reservation.
  years:
    value: 2015-2016
    status: confirmed
    source: p. 7 (Section 3.3); Table 5.1 notes
    note: |-
      REDS/SEPRI 2015-16 is a single cross-section; reservation is status "in the current electoral period".
      Groundwater scarcity is measured over 2013-2014. CPHS 2015-2023 is used only in Section 4.
  kind_of_data_for_outcomes:
    value: REDS survey
    status: confirmed
    source: p. 7 and fn 7; table notes ("Data from SEPRI 2015-16 and CGWB database")
    note: |-
      REDS 2015-16 household and village modules (the round is also called SEPRI), merged with CGWB well
      depths. Panchayat finance and employment and firm employment (Table 5.2) come from the REDS village
      module.
  number_of_outcomes:
    value: '47'
    status: confirmed
    source: Tables 5.1-5.7 (pdf p. 14-22; printed p. 13-21)
    note: |-
      Counting rule: regression columns reporting the GW>8m x Reserved interaction in Section 5 main tables.
      Table 5.1 = 6 (agri, non-agri for all, female, male); 5.2 = 8 (revenue, expenditure, Panchayat
      employment in local infrastructure and in local facilities and schemes, firm employment in trading,
      construction, manufacturing, other services); 5.3 = 4 (non-NREGS, NREGS for female, male); 5.4 = 8
      (4 outcomes x female, male); 5.5 = 4; 5.6 = 10; 5.7 = 7. Total 6+8+4+8+4+10+7 = 47. Excludes Section 4
      CPHS tables 4.1-4.2 (10 columns, no reservation) and appendix tables B and C. Distinct outcome concepts
      are fewer (female non-NREGS days in 5.3 is the sum of 5.1 cols 3-4, for example). This is a column
      count, while Chaturvedi et al.'s count is of distinct outcomes; the table should use one rule.
  outcomes:
    value: |-
      Employment: agricultural days worked; non-agricultural days worked; total non-NREGS days worked; NREGS days worked. These are estimated separately for women and men (agricultural and non-agricultural days also for all adults).
      NREGS access / implementation: registered on a job card; received unemployment allowance; received enough work; average wage rate. Estimated separately for women and men.
      Local employment structure: Panchayat revenue and expenditure; Panchayat employment in local infrastructure and local facilities/schemes; private employment in trading, construction/repair, manufacturing/production, and other services.
      Household welfare: total household income; per-capita income; total consumption; per-capita consumption.
      Consumption composition: total food expenditure; cereals/pulses; milk/meat/eggs; vegetables/fruits; alcohol/tobacco; total non-food expenditure; jewelry/ornaments; clothing/footwear; education expenditure; medical expenditure.
      Child education: enrolled; attendance; government school; private school; school expenditure for all children, ages 5–10, and ages 11–16.
    status: mismatch
