  results:
    value: |-
      “...female-led villages generate significantly more non-NREGS employment for male workers outside agriculture” (p. 12).

      “rather than being better at raising revenues or increasing local government spending, female leaders in areas with poor groundwater are more effective at generating local employment through a reallocation of economic activities towards more labour-intensive sectors” (p. 15; see also Table 5.2).

      “...the statistically significant and positive coefficients of the interaction term between poor groundwater availability and female reservation … show that a female leader counteracts the negative impact of groundwater scarcity” (p. 18; see also Table 5.5).

      The paper’s main positive results are about heterogeneity by groundwater scarcity, not about an overall average effect of women’s reservation. In the regression setup, the coefficient on Reserved captures the effect of reservation in the GW < 8 reference group, and in the main employment and household-welfare tables those coefficients are mostly small and statistically insignificant.
    status: mismatch
    source: printed p. 12, 15, 18 (pdf p. 13, 16, 19); Tables 5.1-5.7
    note: |-
      Quote 1 verbatim, printed p. 12 (pdf 13); Table 5.1 col 6 interaction 28.055*** (10.214). Quote 2
      verbatim but on printed p. 15 (pdf p. 16), not p. 16. Quote 3 verbatim (ellipsis replaces "in the third
      row"), printed p. 18; Table 5.5 interactions 0.269**, 0.279**, 0.092**, 0.092**. Paragraph 4 is right
      for the employment tables (5.1, 5.3: Reserved insignificant except male non-NREGS -8.016*) and Table 5.5
      (all insignificant), but it omits that in good-groundwater villages Reserved is significantly negative
      elsewhere: job-card registration -0.036*** (women) and -0.032** (men), unemployment allowance -0.013**
      (Table 5.4); education spending -0.121** (Table 5.6); child school spending -0.174***, -0.236***,
      -0.142** (Table 5.7). Also, fn 13 (p. 18) says that with continuous groundwater depth (Table C.2) "only
      the consumption coefficients remain significant at the 10% level".

      Proposal restated as the full replacement text: the auditor's two edits applied to the current cell.
      Auditor's original proposal: Same text with "(p. 16; see also Table 5.2)" changed to "(p. 15; see also Table 5.2)", and the last paragraph extended: "...those coefficients are mostly small and statistically insignificant, though in Tables 5.4, 5.6 and 5.7 reservation is significantly negative in good-groundwater villages (e.g. child school expenditure -0.17***). With a continuous groundwater measure, the income interaction loses significance and consumption is significant only at 10% (fn 13, p. 18)."
    proposed: |-
      “...female-led villages generate significantly more non-NREGS employment for male workers outside agriculture” (p. 12).

      “rather than being better at raising revenues or increasing local government spending, female leaders in areas with poor groundwater are more effective at generating local employment through a reallocation of economic activities towards more labour-intensive sectors” (p. 15; see also Table 5.2).

      “...the statistically significant and positive coefficients of the interaction term between poor groundwater availability and female reservation … show that a female leader counteracts the negative impact of groundwater scarcity” (p. 18; see also Table 5.5).

      The paper’s main positive results are about heterogeneity by groundwater scarcity, not about an overall average effect of women’s reservation. In the regression setup, the coefficient on Reserved captures the effect of reservation in the GW < 8 reference group, and in the main employment and household-welfare tables those coefficients are mostly small and statistically insignificant, though in Tables 5.4, 5.6 and 5.7 reservation is significantly negative in good-groundwater villages (e.g. child school expenditure -0.17***). With a continuous groundwater measure, the income interaction loses significance and consumption is significant only at 10% (fn 13, p. 18).
