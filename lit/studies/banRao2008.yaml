preferences:
- row: PRA
  codes:
    drinking_water:
      value: F
      status: confirmed
      source: p. 514, Table 5; p. 513
      note: |-
        Stated problems/priorities "2 years ago" from group PRAs. Women's preferences come from a separate women's PRA; men's come from the general PRA, which was "mainly men" (p. 6; Table 5 note 1). The outcome is the fraction of villages whose group names the item; the women-men gap is estimated by LPM with village FE and clustered SEs. Water: .466 vs .392, gap .075 (.033)**, so F follows from a significant positive gap. Text: "the large differences are in water and sanitation, which women are more likely to see as a problem" (p. 11).
    roads:
      value: M
      status: confirmed
      source: p. 514, Table 5; p. 513
      note: |-
        Roads: .094 women vs .177 men, gap -.081 (.024)***. Negative and significant, so M. Text: "roads, which men are more likely to see as a problem" (p. 11).
    transport:
      value: NS
      status: confirmed
      source: p. 514, Table 5
      note: |-
        Transport: .042 vs .029, gap .013 (.010), not significant, so NS.
    electricity:
      value: NS
      status: confirmed
      source: p. 514, Table 5
      note: |-
        Electricity: .026 vs .035, gap -.010 (.013), not significant, so NS.
    educ:
      value: NS
      status: confirmed
      source: p. 514, Table 5
      note: |-
        Education: .036 vs .035, gap .000 (.013), not significant, so NS.
    sanitation:
      value: F
      status: confirmed
      source: p. 514, Table 5; p. 513
      note: |-
        Sanitation: .101 vs .048, gap .052 (.019)***. Positive and significant, so F.
    health_child_care:
      value: NS
      status: confirmed
      source: p. 514, Table 5
      note: |-
        Health: .055 vs .055, gap .003 (.016), not significant, so NS. There is no child-care item.
- row: HH Survey
  codes:
    drinking_water:
      value: NS
      status: confirmed
      source: p. 514, Table 6; p. 513
      note: |-
        Individual ranking of village problems "2 years ago" in the household questionnaire. LPM of the preference indicator on female, with village FE and clustered SEs; sample is literate adults 21 and over (Table 6 note 4), n = 2,113. Water gap -.010 (.020), so NS. Text: without FE women lean toward water, but "Controlling for village fixed effects, however, no differences remain" (p. 11).
